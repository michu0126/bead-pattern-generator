services:
  bead-pattern:
    image: ${BEAD_PATTERN_IMAGE:-ghcr.io/michu0126/bead-pattern-generator:latest}
    # 本地开发时可删除上面的 image，并取消下一行注释：
    # build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    deploy:
      resources:
        limits:
          memory: 768M
