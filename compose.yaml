services:
  bead-pattern:
    image: michu0126/bead-pattern-generator:latest
    container_name: bead-pattern
    ports:
      - "18026:18026"
    restart: unless-stopped
    environment:
      # 设置后才能从网页管理兼容 API；请改成自己的强密码。
      SETTINGS_PASSWORD: ""
    volumes:
      - bead-pattern-data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    deploy:
      resources:
        limits:
          memory: 768M

volumes:
  bead-pattern-data:
