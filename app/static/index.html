<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拼豆图纸生成器</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <span class="eyebrow">BEAD STUDIO</span>
      <h1>把喜欢的图片，变成拼豆图纸</h1>
      <p>上传图片，选择尺寸与颜色数量，即可生成带色号的网格和用量清单。</p>
    </header>

    <section class="card controls">
      <label class="drop" id="drop-zone">
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp" required>
        <span id="file-label">点击选择图片，或拖到这里</span>
        <small>PNG、JPG 或 WebP，最大 12 MB</small>
      </label>
      <div class="fields">
        <label>横向颗数<input id="width" type="number" min="8" max="100" value="32"></label>
        <label>纵向颗数<input id="height" type="number" min="8" max="100" value="32"></label>
        <label>颜色数量<input id="colours" type="number" min="2" max="25" value="12"></label>
      </div>
      <button id="generate">生成图纸</button>
      <p id="message" role="status"></p>
    </section>

    <section id="result" class="result hidden">
      <div class="card preview">
        <div class="section-title"><h2>图纸预览</h2><a id="download" download="bead-pattern.png">下载 PNG</a></div>
        <div class="image-wrap"><img id="pattern" alt="生成的拼豆图纸"></div>
      </div>
      <div class="card summary">
        <div class="section-title"><h2>材料清单</h2><span id="total"></span></div>
        <div id="palette"></div>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
